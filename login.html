<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Administrador</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-purple-100 to-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-md text-center">
    <h1 class="text-3xl font-bold mb-6 text-purple-700">Login Administrador</h1>
    <input id="senhaInput" type="password" placeholder="Senha" class="border rounded px-4 py-2 w-full mb-4 focus:ring-2 focus:ring-purple-300">
    <button id="entrarBtn" class="bg-purple-700 text-white px-6 py-2 rounded hover:bg-purple-800 transition w-full">Entrar</button>
    <p id="msgErro" class="text-red-500 mt-2 hidden">Senha incorreta!</p>
  </div>

  <script>
    const senhaCorreta = 'ADM2025_01';
    const senhaInput = document.getElementById('senhaInput');
    const entrarBtn = document.getElementById('entrarBtn');
    const msgErro = document.getElementById('msgErro');

    entrarBtn.addEventListener('click', () => {
      if(senhaInput.value === senhaCorreta){
        localStorage.setItem('adminAutenticado', 'true');
        window.location.href = 'index.html';
      } else {
        msgErro.classList.remove('hidden');
        senhaInput.value = '';
      }
    });
  </script>
</body>
</html>
